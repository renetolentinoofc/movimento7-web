services:
  - type: web
    name: movimento7-web
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm run start --workspace @movimento7/web -- --hostname 0.0.0.0 --port $PORT
    healthCheckPath: /saude
    envVars:
      - key: NODE_VERSION
        value: 24.10.0
      - key: NODE_ENV
        value: production
      - key: INTERNAL_API_URL
        sync: false
      - key: NEXT_PUBLIC_SITE_URL
        sync: false
      - key: APP_VERSION
        value: 0.1.0
